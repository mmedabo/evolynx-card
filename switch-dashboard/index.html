<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SWITCH 2026 · Evolynx Dashboard</title><meta name="robots" content="noindex"><meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="style.css"></head><body>
<div id="login" class="login"><div class="box"><div class="brand"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#2563eb"/><path d="M9 11h14M9 16h10M9 21h14" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg><div><h1>SWITCH 2026 Dashboard</h1><p>Evolynx Tech · Blue Cloud</p></div></div>
<label for="pc">Passcode</label><input id="pc" type="password" placeholder="Enter your passcode" autocomplete="current-password"><button id="go">Sign in</button><div id="lerr" class="err" role="alert"></div><a href="#" id="inv">First time? Use invite code</a></div>
<div class="box" id="invbox" hidden><h1>Set up your passcode</h1><label for="ic">Invite code</label><input id="ic" placeholder="From your admin" autocomplete="off"><label for="np">New passcode</label><input id="np" type="password" placeholder="At least 8 characters" autocomplete="new-password"><label for="np2">Confirm passcode</label><input id="np2" type="password" placeholder="Type it again" autocomplete="new-password"><button type="button" class="ghost" id="sug">Suggest a strong passcode</button><span id="sugv" class="muted"></span><button id="act">Activate &amp; sign in</button><div id="ierr" class="err" role="alert"></div><a href="#" id="back">Back to sign in</a></div></div>
<div id="app" hidden>
<header class="top"><div class="brand"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#2563eb"/><path d="M9 11h14M9 16h10M9 21h14" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg><b>SWITCH 2026</b></div><span class="sp"></span><span id="who"></span><button id="chg" class="ghost">Change passcode</button><button id="out" class="ghost">Sign out</button></header>
<nav id="tabs" class="tabs"><button data-t="connections" class="on">Connections</button><button data-t="competitors">Competitors</button><button data-t="upload">Upload</button><button data-t="chat">Assistant</button><button data-t="team" id="teamTab" hidden>Team</button></nav>
<section id="tiles" class="tiles"></section>
<main id="view"></main></div>
<aside id="dock" class="dock" hidden aria-label="Assistant chat"><div class="dockh"><span class="orb sm" aria-hidden="true"></span><b>Assistant</b><span class="sp"></span><button id="dockx" class="ghost x" aria-label="Close chat">✕</button></div><div id="dockbody"></div></aside>
<button id="fab" class="fab" hidden title="Chat with assistant">💬 Assistant</button>
<dialog id="dlg" class="drawer"><form method="dialog" id="dform"></form></dialog>
<script src="app.js"></script></body></html>
